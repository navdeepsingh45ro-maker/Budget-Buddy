<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BudgetBuddy - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#69577f",
                    "on-primary-fixed": "#231437",
                    "error": "#ba1a1a",
                    "on-background": "#1d1b1e",
                    "secondary-container": "#e8d1ff",
                    "surface-container-low": "#f8f2f6",
                    "tertiary-fixed": "#eae5a3",
                    "on-primary": "#ffffff",
                    "on-tertiary-container": "#44410f",
                    "on-tertiary-fixed": "#1e1c00",
                    "tertiary-container": "#b2ae71",
                    "secondary-fixed-dim": "#d4beeb",
                    "primary-fixed-dim": "#d3beeb",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f5eff3",
                    "on-primary-fixed-variant": "#503f65",
                    "tertiary": "#63602c",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#ded8dc",
                    "outline-variant": "#cbc4ce",
                    "background": "#fef8fb",
                    "on-surface-variant": "#4a454d",
                    "tertiary-fixed-dim": "#cec98a",
                    "primary-fixed": "#eddcff",
                    "outline": "#7b757e",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#eedbff",
                    "on-primary-container": "#fffbff",
                    "surface-tint": "#68577e",
                    "surface-container": "#f2ecf0",
                    "surface-container-highest": "#e6e1e5",
                    "on-error-container": "#93000a",
                    "secondary": "#69577e",
                    "surface-container-high": "#ece7ea",
                    "primary-container": "#7f6d95",
                    "primary": "#66547b",
                    "on-surface": "#1d1b1e",
                    "on-secondary-fixed-variant": "#503f65",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fef8fb",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#fef8fb",
                    "inverse-primary": "#d3beeb",
                    "surface-variant": "#e6e1e5",
                    "inverse-surface": "#323033",
                    "on-secondary-fixed": "#231437",
                    "on-tertiary-fixed-variant": "#4b4816"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "margin-mobile": "16px",
                    "xl": "48px",
                    "base": "4px",
                    "margin-desktop": "40px",
                    "lg": "32px",
                    "sm": "16px",
                    "gutter": "24px",
                    "xs": "8px"
            },
            "fontFamily": {
                    "headline-xl": ["Plus Jakarta Sans"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-xl-mobile": ["Plus Jakarta Sans"],
                    "headline-sm": ["Plus Jakarta Sans"],

                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]

          },
        },
      }

<style>
        body {
            background-color: #fef8fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .form-shadow {
            box-shadow: 0px 4px 20px rgba(151, 132, 174, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md overflow-x-hidden">
<!-- Atmospheric Background Decoration -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute top-[60%] -right-[5%] w-[30%] h-[30%] bg-secondary-container/10 rounded-full blur-[80px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-gutter py-xl">
<!-- Header / Logo Area -->
<header class="mb-lg text-center animate-in fade-in slide-in-from-bottom-4 duration-700"><div class="flex flex-col items-center gap-sm mb-lg">
<div class="flex items-center gap-md">
<div class="w-12 h-12 flex items-center justify-center">
<img alt="BudgetBuddy Mascot" class="w-full h-full object-contain" src="/Frontend/Assets/budgetbuddy-logo.png"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-background tracking-tight">BudgetBuddy</h1>
</div>
<p class="text-outline font-body-sm mt-xs max-w-[320px] mx-auto">
    Step back into your journey toward financial serenity.
  </p>
</div></header>
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-white p-xl rounded-xl border border-outline-variant/30 shadow-sm animate-in fade-in zoom-in-95 duration-1000">
<form class="flex flex-col gap-sm"><!-- Email Field -->
<div class="flex flex-col gap-xs mb-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-outline/40" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs mb-md">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-outline/40" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-bold flex items-center justify-center gap-xs hover:opacity-90 active:scale-[0.99] transition-all duration-200 shadow-lg shadow-primary/20" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Create Account Link -->
<p class="text-center mt-lg text-body-sm">
<span class="text-outline">New to BudgetBuddy?</span>
<a class="font-bold text-primary hover:underline underline-offset-4 ml-1" href="#">Create an account</a>
</p></form>
</div>
<!-- Footer / Trust Badges -->
<footer class="mt-lg flex flex-col items-center gap-sm animate-in fade-in slide-in-from-top-4 duration-1000 delay-300"><div class="flex gap-lg">
<a class="text-[12px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="text-[12px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<a class="text-[12px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Help Center</a>
</div></footer>
</main>
<!-- Success Message Micro-interaction (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 bg-secondary-container text-on-secondary-container px-md py-sm rounded-full flex items-center gap-xs shadow-lg transition-all duration-500 z-50" id="login-feedback">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md">Welcome back, Traveler!</span>
</div>
<script>
        // Simple Micro-interactions
        const loginForm = document.querySelector('form');
        const feedback = document.getElementById('login-feedback');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Animation for visual confirmation
            feedback.classList.remove('translate-y-20', 'opacity-0');
            feedback.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                feedback.classList.add('translate-y-20', 'opacity-0');
                feedback.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        });

        // Toggle Password Visibility
        const passToggle = document.querySelector('button[type="button"] span.material-symbols-outlined');
        const passInput = document.getElementById('password');
        
        document.querySelector('button[type="button"]').addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passToggle.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                passToggle.textContent = 'visibility';
            }
        });
    </script>
</body></html>
