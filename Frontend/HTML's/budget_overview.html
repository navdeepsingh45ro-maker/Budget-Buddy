<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#66547b">
<link rel="apple-touch-icon" href="../Assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BudgetBuddy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="../Assets/icons/icon-192.png">
<title>BudgetBuddy - Budget Overview</title>
<link rel="stylesheet" href="../Assets/fonts/fonts.css">
<link rel="stylesheet" href="../Assets/fonts/fonts-inter-700.css">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .soft-shadow {
            box-shadow: 0px 4px 20px rgba(151, 132, 174, 0.15);
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full overflow-hidden bg-secondary-container flex items-center justify-center">
<img alt="BudgetBuddy Mascot" class="w-full h-full object-cover" src="../Assets/budgetbuddy-logo.png"/>
</div>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">BudgetBuddy</h1>
</div>
<button class="material-symbols-outlined p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-all">notifications</button>
</header>
<main class="px-margin-mobile py-md max-w-2xl mx-auto">
<!-- Hero Section -->
<section class="mb-lg"><div class="flex justify-between items-end mb-sm"><div><h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Monthly Pulse</h1><p id="hero-subtitle" class="font-body-md text-on-surface-variant">Loading...</p></div><div class="text-right"><p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Remaining</p></div></div><div class="w-full h-2 bg-secondary-container rounded-full overflow-hidden mb-xs"><div id="hero-progress-bar" class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width: 0%;"></div></div></section>
<!-- Category Grid / List -->
<div id="categories-list" class="space-y-md">
<!-- Category cards will be rendered by budgetOverview.js -->
</div>
<!-- Add Category Placeholder -->
<button id="update-budget-btn" class="w-full mt-lg py-md border border-primary/20 rounded-xl flex items-center justify-center gap-xs text-primary bg-primary/5 hover:bg-primary/10 transition-all active:scale-95"><span class="material-symbols-outlined">add_circle</span><span class="font-label-md text-label-md">Update Budget</span></button>
<button id="generate-report-btn" class="w-full mt-sm py-md border border-primary/20 rounded-xl flex items-center justify-center gap-xs text-primary bg-primary-container/20 hover:bg-primary-container/30 transition-all active:scale-95"><span class="material-symbols-outlined text-[20px]">auto_awesome</span><span class="font-label-md text-label-md">Monthly Report</span></button>
<a href="budget_history.html" class="w-full mt-sm py-md border border-outline-variant/20 rounded-xl flex items-center justify-center gap-xs text-on-surface-variant bg-surface-container-low hover:bg-surface-container transition-all active:scale-95"><span class="material-symbols-outlined text-[20px]">timeline</span><span class="font-label-md text-label-md">View History</span></a>
<!-- Budget Modal -->
<div id="budget-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-surface w-[90%] max-w-sm rounded-[24px] p-6 soft-shadow transform scale-95 transition-all duration-300" id="budget-modal-content">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-headline-sm text-headline-sm text-on-background" id="budget-modal-title">Set Monthly Budget</h2>
            <button id="close-budget-modal" class="text-outline hover:text-on-surface-variant transition-colors p-2 rounded-full hover:bg-surface-container active:scale-95">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <p class="text-body-sm text-on-surface-variant mb-6" id="budget-modal-desc">Please tell your budget for this month to help us track your expenses better.</p>
        
        <form id="budget-form" class="space-y-6">
            <div>
                <label class="block font-label-md text-label-md text-on-surface-variant px-base mb-2">Monthly Budget (₹)</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-sm text-outline">₹</span>
                    <input id="budget-input" type="number" step="0.01" min="0" required class="w-full h-14 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant/30 rounded-2xl font-body-lg text-on-background soft-shadow focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/60" placeholder="0.00">
                </div>
            </div>
            
            <button type="submit" class="w-full h-14 bg-primary text-on-primary rounded-2xl font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
                <span id="budget-submit-text">Save Budget</span>
            </button>
        </form>
    </div>
</div>
<!-- Report Modal -->
<div id="report-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-surface w-[90%] max-w-lg rounded-[24px] p-6 soft-shadow transform scale-95 transition-all duration-300 max-h-[85vh] overflow-y-auto" id="report-modal-content">
        <div class="flex justify-between items-center mb-4 sticky top-0 bg-surface z-10 py-2 border-b border-outline-variant/20">
            <h2 class="font-headline-sm text-headline-sm text-on-background flex items-center gap-2"><span class="material-symbols-outlined text-primary">auto_awesome</span> AI Report</h2>
            <button id="close-report-modal" class="text-outline hover:text-on-surface-variant transition-colors p-2 rounded-full hover:bg-surface-container active:scale-95">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div id="report-month-wrap" class="mb-4">
            <label for="report-month-select" class="block font-label-md text-label-md text-on-surface-variant px-base mb-2">Month</label>
            <select id="report-month-select" class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant/30 rounded-2xl font-body-md text-on-background soft-shadow focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all disabled:opacity-60"></select>
        </div>
        <div id="report-modal-body" class="text-body-md text-on-surface whitespace-pre-line"></div>
    </div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-white/90 backdrop-blur-lg border-t border-surface-container-high z-50 rounded-t-[24px] soft-shadow">
<a class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors" href="dashboard.html">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium mt-0.5">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary group" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[10px] font-bold mt-0.5">Budget</span>
</a>
<a class="flex flex-col items-center justify-center -mt-8" href="add_expense.html">
<div class="w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg border-4 border-background">
<span class="material-symbols-outlined text-[32px]">add</span>
</div>
</a>
<a class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors" href="history.html">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-medium mt-0.5">History</span>
</a>
<a class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors" href="profile.html">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium mt-0.5">Profile</span>
</a>
</nav>
<script src="../Javascript's/api.js"></script>
<script src="../Javascript's/budgetOverview.js"></script>
<script src="../Javascript's/notifications.js"></script>
</body></html>
